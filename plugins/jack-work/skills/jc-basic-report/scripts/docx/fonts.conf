<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">pandoc-doc-fontconfig</cachedir>
  <alias><family>宋体</family><prefer><family>STSong</family><family>Songti SC</family></prefer></alias>
  <alias><family>SimSun</family><prefer><family>STSong</family><family>Songti SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Songti SC</family><family>STSong</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>PingFang SC</family><family>Hiragino Sans GB</family></prefer></alias>
</fontconfig>
